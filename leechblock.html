<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Pause</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    img {
      max-width: 70vw;
      max-height: 70vh;
      object-fit: contain;
    }

    button {
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <img src="https://image-resizing.booztcdn.com/hoptimist/hot26156_cwhite_vbumble_9.webp?has_webp=1&version=74a28bc085109e37c66682b8e0cd63a8&size=w900">

  <button id="continue">I still want to continue</button>

  <script>
    document.getElementById("continue").addEventListener("click", function () {
      const params = new URLSearchParams(window.location.search);
      const blockedURL = params.get("u");

      if (blockedURL) {
        window.location.href = blockedURL;
      }
    });
  </script>

</body>
</html>
