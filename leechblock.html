<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    img {
      max-width: 70vw;
      max-height: 65vh;
      object-fit: contain;
    }

    button {
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <img
    src="https://image-resizing.booztcdn.com/hoptimist/hot26156_cwhite_vbumble_9.webp?has_webp=1&version=74a28bc085109e37c66682b8e0cd63a8&size=w900"
    alt="Pause"
  >

  <button id="continueButton">
    I still want to continue
  </button>

  <script>
    document.getElementById("continueButton").addEventListener("click", function () {

      // LeechBlock gives us:
      // ?1&http://youtube.com/

      const query = window.location.search.substring(1);
      const ampersand = query.indexOf("&");

      if (ampersand === -1) {
        alert("No destination URL found.");
        return;
      }

      const destination = query.substring(ampersand + 1);

      if (!destination) {
        alert("No destination URL found.");
        return;
      }

      window.location.href = destination;
    });
  </script>

</body>
</html>
