<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pause</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
    }

    img {
      max-width: 70vw;
      max-height: 65vh;
    }

    button {
      margin-top: 30px;
      padding: 14px 28px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <img
    src="https://image-resizing.booztcdn.com/hoptimist/hot26156_cwhite_vbumble_9.webp?has_webp=1&version=74a28bc085109e37c66682b8e0cd63a8&size=w900"
    alt="Pause"
  >

  <button onclick="continueToSite()">
    I still want to continue
  </button>

  <script>
    function continueToSite() {
      const query = window.location.search.substring(1);
      const separator = query.indexOf("&");

      if (separator === -1) {
        alert("I can't find the original website.");
        return;
      }

      const destination = query.substring(separator + 1);

      alert("Going to: " + destination);

      window.location.replace(destination);
    }
  </script>

</body>
</html>
