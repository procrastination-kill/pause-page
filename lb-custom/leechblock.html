<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pause</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    img {
      max-width: 70vw;
      max-height: 65vh;
      object-fit: contain;
    }

    #timer {
      margin-top: 25px;
      font-size: 24px;
    }

    #lbBlockedURLLink {
      margin-top: 15px;
      pointer-events: none;
      opacity: 0.4;
    }

    #lbBlockedURLLink.enabled {
      pointer-events: auto;
      opacity: 1;
    }

    button {
      padding: 14px 28px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <img
    src="https://image-resizing.booztcdn.com/hoptimist/hot26156_cwhite_vbumble_9.webp?has_webp=1&version=74a28bc085109e37c66682b8e0cd63a8&size=w900"
    alt="Pause"
  >

  <div id="timer">Wait 30 seconds...</div>

  <a id="lbBlockedURLLink" href="#">
    <button type="button">
      I still want to continue
    </button>
  </a>

  <script>
    const DELAY = 30;

    let remaining = DELAY;

    const timer = document.getElementById("timer");
    const link = document.getElementById("lbBlockedURLLink");

    const countdown = setInterval(() => {
      remaining--;

      if (remaining > 0) {
        timer.textContent = `Wait ${remaining} seconds...`;
        return;
      }

      clearInterval(countdown);

      timer.textContent = "You can continue.";
      link.classList.add("enabled");

      /*
       * Tell LeechBlock NG that our custom delay
       * has finished.
       *
       * blocked.js listens for this message and
       * forwards it to the LeechBlock extension.
       */
      window.postMessage({
        type: "REPORT_DELAY_TO_LEECHBLOCK_NG",
        blockURL: link.href,
        blockedSet: Number(new URLSearchParams(location.search).get("set"))
      }, "*");

    }, 1000);
  </script>

</body>
</html>
